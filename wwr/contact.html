<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Ecuador Rafting Adventures</title>

    <meta name="description" content="Discover Ecuador Rafting Adventures, an exciting whitewater rafting company inspired by the rivers of Tena, Ecuador.">

    <meta name="author" content="Abrahan Andrade">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo2.png" alt="Ecuador Rafting Adventures Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="company-info">

            <h1>Ecuador Rafting Adventures</h1>     
            
            <p>123 San Juan y Av. Los Rios</p>
            <p>Tena, Ecuador</p>
            <p>+593 998 555 666</p>
            <p>info@ecuadorraftingadv.com</p>
            
        </section>

        <section class="contact-layout">
            <div class="" map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31913.709743480664!2d-77.
                    83547427769766!3d-0.9974737855445873!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91d
                    6a44047cf041d%3A0xff1b504985f2d31b!2sTena%2C%20Ecuador!5e0!3m2!1ses!2sus!4v1795817149394!5m2!
                    1ses!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <section class="contact-form">

                <form action="#" method="get">
                
                    <div class="form-item">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
                    </div>

                    <div class="form-item">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" placeholder="Enter your email" required>
                    </div>

                    <div class="form-item">
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phonenumber" name="phonenumber" placeholder="Enter your phone">
                    </div>

                    <fieldset class="form-item purpose">
                    
                        <legend>Message Purpose</legend>
                    
                        <div class="purpose-options">
                            <label>
                                <input type="radio" id="general" name="general">
                                General Inquiry
                            </label>
                            <label>
                                <input type="radio" id="reservation" name="reservation">
                                Reservation Question
                            </label>
                            <label>
                                <input type="radio" id="suggestion" name="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </fieldset>
                    
                    <div class="form-item message-item">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                    </div>

                    <div class="newsletter">
                        <label for="susbscribe">
                            <input type="checkbox" id="suggestion" name="suggestion">
                            Please Subscribe me to the monthyly newsletter
                        </label>
                    </div>

                    <button type="submit">Get it Touch!</button>

                </form>

            </section>

        </section>

    <section class="adventures">

        <h2>We Are Here To Serve You!</h2>

        <div class="profile-gallery">

            <figure>
                <img src="images/profile.png" alt="Abrahan Andrade">
                <figcaption>Abrahan Andrade</figcaption>
            </figure>

            <figure>
                <img src="images/profile2.png" alt="Kakashi Hatake">
                <figcaption>Kakashi Hatake</figcaption>
            </figure>

            <figure>
                <img src="images/profile3.png" alt="Androide 18">
                <figcaption>Androide 18</figcaption>
            </figure>

        </div>

    </section>

    </main>

    <footer>

        <p>&copy; 2026 Ecuador Rafting Adventures | Abrahan Andrade</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="YouTube">
            </a>

        </nav>

    </footer>

</body>

</html>
