<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML and CSS practice quiz">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <main>
        <h1>HTML and CSS Quiz</h1>
        <p>Test your knowledge of HTML and CSS!</p>

        <form>

            <!-- Question 1: Fill in the blank -->
            <div class="question">
                <label for="q1">
                    1. What HTML tag is used to create a paragraph?
                </label>
                <input type="text" id="q1" name="q1" placeholder="Enter your answer" required>
            </div>

            <!-- Question 2: Short answer -->
            <div class="question">
                <label for="q2">
                    2. Explain the difference between HTML and CSS.
                </label>
                <textarea id="q2" name="q2" rows="4" placeholder="Write your answer here..." required></textarea>
            </div>

            <!-- Question 3: Dropdown -->
            <div class="question">
                <label for="q3">
                    3. Which CSS property changes the text color?
                </label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One...</option>
                    <option value="background">background</option>
                    <option value="color">color</option>
                    <option value="margin">margin</option>
                </select>
            </div>

            <!-- Question 4: Number answer -->
            <div class="question">
                <label for="q4">
                    4. How many heading levels are available in HTML?
                </label>
                <input type="number" id="q4" name="q4" placeholder="Enter a number" required>
            </div>

            <!-- Submit button -->
            <button type="submit">Submit Quiz</button>

        </form>
    </main>

</body>

</html>
